end4_commit = "42d0aae17b744a38cd05c9044c189bfc9b13869a"

[module.base]
description = "Fixes on top of end-4: per-user temp folders, weather retry, shared config keys, shadow render power for Hyprland 0.57, search opens only on a lone Super tap, translucent foot; no anime image boards"
default = true
desktop = true
remove = [".config/quickshell/ii/modules/ii/sidebarLeft/Anime.qml", ".config/quickshell/ii/modules/ii/sidebarLeft/anime", ".config/quickshell/ii/services/Booru.qml", ".config/quickshell/ii/services/BooruResponseData.qml", ".config/quickshell/ii/scripts/colors/random/random_konachan_wall.sh", ".config/quickshell/ii/defaults/ai/prompts/ii-Imouto.md"]
settings = { "background.widgets.clock.enable" = [true, false], "bar.weather.enable" = [false, true] }

[module.display-input]
description = "Monitor layout and scale, 10 workspaces per screen (laptop 1-10, then 11-20, 21-30... per output), keyboard layouts, layout switch on SUPER+Space"
default = true
desktop = true
packages = { arch = ["jq", "libnotify"], ubuntu = ["jq", "libnotify-bin"] }

[module.keybinds]
description = "SUPER+SHIFT+N moves a window to workspace N of the current screen, SUPER+SHIFT+ALT+Left/Right to the other screen; SUPER+ALT+N and Print unbound"
default = true
desktop = true

[module.window-rules]
description = "A fullscreen window leaves fullscreen when a second window joins its workspace"
default = true
desktop = true

[module.session-restore]
description = "Saves the open windows every few minutes and reopens them at login; power off, reboot and logout wait for windows to close so Chrome reopens its pages"
default = true
desktop = true
packages = { arch = ["python"], ubuntu = ["python3"] }
user_units = ["hypr-session-save.service", "hypr-session-save.timer"]
enable = ["hypr-session-save.timer"]

[module.idle-lid]
description = "Idle lock and suspend, wake handling, an alert when the lid is closed while kept awake"
default = true
desktop = true
packages = { arch = ["jq", "wireplumber"], ubuntu = ["jq", "wireplumber"] }

[module.lockscreen]
description = "Fallback lock style (hyprlock, used only when quickshell is not running): blurred wallpaper, clock and fields placed for a laptop screen"
default = true
desktop = true

[module.ssh-agent]
description = "One ssh-agent per session, keys loaded at login with passphrases from the keyring"
default = true
desktop = true
packages = { arch = ["openssh", "libsecret"], ubuntu = ["openssh-client", "libsecret-tools"] }
enable_system_user_units = ["ssh-agent.socket"]

[module.clipboard-wipe]
description = "Clears the clipboard history on a timer"
default = false
desktop = true
packages = { arch = ["cliphist"], ubuntu = ["cliphist"] }
user_units = ["clipboard-wipe.service", "clipboard-wipe.timer"]
enable = ["clipboard-wipe.timer"]

[module.cheatsheet-extras]
description = "Cheatsheet: an Aliases tab listing your fish aliases, Esc closes it"
default = true
desktop = true

[module.fish-aliases]
description = "eza based ls, ll, tree; reload, clear, renametab, rot13, fishrc, keybinds; ~/.local/bin in PATH"
default = true
desktop = false
packages = { arch = ["fish", "eza"], ubuntu = ["fish", "eza"] }

[module.kitty]
description = "kitty: translucent, Ctrl+C copies or interrupts, Ctrl+Shift+V pastes, live theme recolor, Super+Shift+T reopens the last closed window"
default = true
desktop = false
packages = { arch = ["kitty"], ubuntu = ["kitty"] }

[module.nvim-vim]
description = "Neovim and Vim config (LSP servers via Mason, blink completion, format on save per repo, which-key, textobjects, trouble), IdeaVim config, the nv alias, nvim as SUDO_EDITOR"
default = false
desktop = false
packages = { arch = ["neovim", "vim"], ubuntu = ["neovim", "vim"] }

[module.dev-git]
description = "Fish helpers: cfmt (clang-format all C/C++), easypush, gtag"
default = false
desktop = false
packages = { arch = ["clang", "git"], ubuntu = ["clang-format", "git"] }

[module.bar-docker]
description = "Bar: running Docker containers with a popup"
default = true
desktop = true

[module.bar-agent-usage]
description = "Bar: a robot icon (only where Claude Code is installed), and workspace icons that show a Claude Code, pi or codex agent working (spin, orbit, ripple), waiting (!) or done (check, or the number of replies you have not looked at yet), with a slow spin and a count at the bottom left while Claude sub-agents run; the window title reads \"Claude - project\" (in kitty only; sub-agent counts and the pi and codex states need the agent-hooks module)"
default = false
desktop = true
packages = { arch = ["python"], ubuntu = ["python3"] }

[module.agent-hooks]
description = "Hooks that tell the bar what agents do (for bar-agent-usage): Claude Code SubagentStart and SubagentStop in ~/.claude/settings.json (sub-agent count), Codex UserPromptSubmit and Stop in ~/.codex/hooks.json (working, done; trust them once in Codex with /hooks, Codex skips new hooks until then), and a pi extension in ~/.pi/agent/extensions; the Claude Code and Codex entries are added only where ~/.claude or ~/.codex exists, next to your own hooks, and removed when unticked"
default = false
desktop = true
packages = { arch = ["python"], ubuntu = ["python3"] }

[module.bar-themes]
description = "Bar: a palette button to switch the theme: Dark and White (from your wallpaper), Midnight, Forest, Arctic, Mint, Desert, Sakura, Ocean, Ember, Lavender, Neon and Autumn (each with three wallpapers to switch from the menu, a dark terminal, and its own particles over the wallpaper, which the menu can turn off); a theme shown in the other mode (light/dark) gets its own palette with lightness flipped and hues kept, instead of a near-white generated one; each theme and mode is prepared in the background (~/.cache/quickshell/theme-cache), so a switch only copies ready files and recolors terminals in parallel; an Auto theme switch picks the theme from time of day, season, temperature and weather (rules in themes/auto.json); an Ambiance switch plays each theme's own ambient sound, downloaded on first use, with next-track and never-again buttons; private themes (your own JSON files in ~/.local/share/quickshell-themes/private/, never shared) can bring local music and sounds for popups, notifications, lock and unlock; the Ambiance section can switch from Sounds to Music, a playlist on your own Subsonic server (set in ~/.config/ambiance-playlist/config.json, never shared) kept as a local copy that plays offline, limited to what a theme's playlistFilter matches"
default = true
desktop = true
packages = { arch = ["python-pillow", "ffmpeg", "qt6-multimedia", "qt6-multimedia-ffmpeg"], ubuntu = ["python3-pil", "ffmpeg", "qml6-module-qtmultimedia"] }

[module.bar-layout]
description = "Bar: resources on the right, no brightness scroll, click the window title for the overview; no screen snip, keyboard or dark mode buttons"
default = true
desktop = true
settings = { "bar.utilButtons.showScreenSnip" = [true, false], "bar.utilButtons.showKeyboardToggle" = [true, false], "bar.utilButtons.showDarkModeToggle" = [true, false] }

[module.bar-resources]
description = "Bar: disk (root and a separate home, titled SSD or HDD), drive health, data written and live I/O, GPU load, CPU and disk temperatures and fan speeds in the resources popup"
default = true
desktop = true
packages = { arch = ["python"], ubuntu = ["python3"] }

[module.notifications-click]
description = "A left click on a notification runs its default action; an identical notification (same app, title and text) within 3 s is dropped; pictures sent as temporary files or in memory (Chrome) are kept, and a missing icon falls back to a symbol instead of a magenta square"
default = true
desktop = true

[module.sidebar-timer]
description = "Sidebar: the Pomodoro tab becomes a plain countdown timer; click the digits to type a time (10, 1:30, 45s), scroll or use -1m/+1m/+5m, even while it runs"
default = true
desktop = true

[module.night-light-sun]
description = "Night light follows sunset and sunrise from the weather service"
default = true
desktop = true
settings = { "light.night.followSun" = [false, true] }

[module.follow-location]
description = "Weather, sunset and sunrise follow your real position (GeoClue, Wi-Fi based) instead of the configured city; wttr.in gets it rounded to about 1 km; on a Wi-Fi listed in bar.weather.cityOnNetworks (e.g. a 4G box the location service places wrongly) the city is used"
default = false
desktop = true
packages = { arch = ["geoclue"], ubuntu = ["geoclue-2.0", "geoclue-2-demo"] }
settings = { "bar.weather.enableGPS" = [false, true] }

[module.ai-sidebar-extras]
description = "AI sidebar: thinking on and off, local Ollama models unloaded when idle, shell command tool, assistant name and icon, aiconfig"
default = true
desktop = true
packages = { arch = ["python"], ubuntu = ["python3"] }

[module.ai-key]
description = "Retired 2026-11-13: the AI key listener was unwired on the source machine; kept so an update removes it"
retired = true
user_units = ["ai-key-listener.service"]
enable = ["ai-key-listener.service"]

[module.io-accounting]
description = "systemd counts disk writes per service (system and user managers)"
default = true
desktop = false
sudo = true

[module.battery-limit]
description = "Laptop battery stops charging at 80% (kept after sleep), for laptops whose kernel exposes a charge limit (ASUS, ThinkPad, Dell, and others)"
default = false
desktop = false
sudo = true

[module.docker-image-prune]
description = "Removes untagged Docker images older than 6 hours, every 6 hours"
default = true
desktop = false
sudo = true
needs_command = "docker"
system_enable = ["docker-image-prune.timer"]

[module.paccache-keep]
description = "Weekly pacman cache cleanup keeping 2 versions"
default = true
desktop = false
sudo = true
os = ["arch"]
packages = { arch = ["pacman-contrib"] }
system_enable = ["paccache.timer"]

[module.sddm-theme]
description = "SilentSDDM login screen with its config"
default = false
desktop = true
sudo = true
packages = { arch = ["sddm", "rsync", "git"], ubuntu = ["sddm", "rsync", "git"] }

[module.terminal-toys]
description = "Terminal Toys: a bar button that plays small animated scenes (garden, cat...) in kitty windows, drawn by a kitty watcher"
default = false
desktop = true
packages = { arch = ["python-pillow"], ubuntu = ["python3-pil"] }

[module.power-button]
description = "The power button no longer powers off; lid close policy"
default = false
desktop = false
sudo = true

[module.multi-user]
description = "One shared checkout for several accounts, a group with write access, each account linking itself"
default = false
desktop = false
sudo = true

